{% extends "base.html" %}

{% block content %}
<div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900 dark:text-white">Sign in to your account</h2>
    <p class="mt-2 text-center text-sm text-gray-600 dark:text-gray-400">
      Or
      <a href="{% url 'register' %}" class="font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-500">
        create a new student account
      </a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div
      class="bg-white dark:bg-gray-800 py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-gray-100 dark:border-gray-700">
      <form class="space-y-6" action="{% url 'login' %}" method="POST">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next|default:'/dashboard/' }}">

        {% if form.errors %}
        <div class="rounded-md bg-red-50 dark:bg-red-900/20 p-4 mb-4">
          <h3 class="text-sm font-medium text-red-800 dark:text-red-400">Your username and password didn't match. Please
            try again.</h3>
        </div>
        {% endif %}

        <div>
          <label for="username" class="block text-sm font-bold text-white uppercase tracking-widest mb-2">Username</label>
          <div class="mt-1">
            <input id="username" name="username" type="text" autocomplete="username" required
              style="color: black !important; background-color: white !important;"
              class="w-full p-3 bg-white text-gray-900 border-2 border-indigo-500 rounded-lg focus:ring-2 focus:ring-indigo-600 focus:outline-none">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-bold text-white uppercase tracking-widest mb-2">Password</label>
          <div class="mt-1">
            <input id="password" name="password" type="password" autocomplete="current-password" required
              style="color: black !important; background-color: white !important;"
              class="w-full p-3 bg-white text-gray-900 border-2 border-indigo-500 rounded-lg focus:ring-2 focus:ring-indigo-600 focus:outline-none">
          </div>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" name="remember-me" type="checkbox"
              class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 dark:border-gray-600 rounded text-black bg-white">
            <label for="remember-me" class="ml-2 block text-sm text-gray-900 dark:text-gray-300">Remember me</label>
          </div>
          <div class="text-sm">
            <a href="#" class="font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-500">Forgot your
              password?</a>
          </div>
        </div>

        <div>
          <button type="submit"
            class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all active:scale-95">
            Sign in
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
